[project]
name = "complexity"
version = "0.1.0"
description = "An experimentation platform for applying complexity measures to dynamical complex systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "av>=12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
complexity = "complexity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complexity"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["RUF012"]  # class-level registry metadata (patterns) is intentional
