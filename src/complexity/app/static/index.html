<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complexity Lab</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <button id="toggle-panel" class="icon" title="Hide the side panel" aria-label="Hide the side panel" aria-expanded="true">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><line x1="6" y1="3" x2="6" y2="13" stroke="currentColor"/></svg>
    </button>
    <h1>Complexity Lab</h1>
    <span class="sub">complexity measures on dynamical complex systems</span>
    <span id="status" class="status">connecting…</span>
    <span id="device" class="device"></span>
    <span id="fps-now" class="fps-now">– FPS</span>
  </header>
  <div class="layout">
    <aside>
      <section>
        <h2>Run</h2>
        <div class="buttons">
          <button id="start" class="primary">Start</button>
          <button id="play" disabled>Pause</button>
          <button id="step" disabled>Step</button>
        </div>
        <label>Steps per frame <output id="spt-out">1</output>
          <input id="spt" type="range" min="0" max="6" value="0"></label>
        <label>Max FPS <output id="fps-out">30</output>
          <input id="fps" type="range" min="0" max="6" value="5"></label>
      </section>
      <section>
        <h2>Systems <span class="hint">compare up to 6</span>
          <button id="clear-runs" class="clear" title="Deselect all systems">Clear</button></h2>
        <div id="runs" class="picklist" role="group" aria-label="Systems"></div>
        <label class="inline">Grid size <select id="size"><option>256</option><option>128</option><option selected>64</option><option>32</option></select></label>
      </section>
      <section>
        <h2>Measures
          <button id="clear-measures" class="clear" title="Deselect all measures">Clear</button></h2>
        <div id="measures" class="picklist" role="group" aria-label="Measures"></div>
      </section>
    </aside>
    <main>
      <div id="views" class="views"></div>
      <div id="table-wrap"></div>
      <div id="charts" class="charts"></div>
      <p id="empty" class="empty">Pick systems and measures, then press <b>Start</b>.</p>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
